<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LordHost - Hosting Botów Discord</title>
  <meta name="description" content="LordHost - Najtańszy hosting botów Discord w Polsce. Pakiety od 3 PLN/mies." />
  <meta name="author" content="LordHost" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="LordHost - Hosting Botów Discord" />
  <meta property="og:description" content="LordHost - Najtańszy hosting botów Discord w Polsce. Pakiety od 3 PLN/mies." />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon - wrzuć logo.png do folderu głównego -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Style -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ NAWIGACJA ============ -->
  <nav class="glass-card" style="position:fixed;top:0;left:0;right:0;z-index:50;padding:12px 20px;border-bottom:1px solid hsl(55,100%,50%,0.15);">
    <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
      <a href="/" style="font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;color:var(--primary);text-decoration:none;">
        <img src="/logo.png" alt="LordHost" style="height:36px;width:36px;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none'" />
        LordHost
      </a>
      <div style="display:flex;gap:16px;align-items:center;">
        <a href="/#pakiety" style="color:var(--foreground);text-decoration:none;font-size:14px;">Pakiety</a>
        <a href="/panel" style="color:var(--foreground);text-decoration:none;font-size:14px;">Panel</a>
        <a href="https://discord.gg/lordhost" target="_blank" style="color:var(--foreground);text-decoration:none;font-size:14px;">Discord</a>
        <a href="lordhostpl.lovable.app/login" style="padding:6px 16px;background:var(--primary);color:var(--primary-foreground);border-radius:8px;font-weight:700;font-size:14px;text-decoration:none;">Zaloguj</a>
      </div>
    </div>
  </nav>

  <!-- ============ BANER HERO ============ -->
  <section class="hero-banner" style="padding-top:100px;text-align:center;">
    <div>
      <h1 class="neon-text" style="font-family:'Orbitron',monospace;font-size:2.5rem;font-weight:900;color:var(--primary);margin-bottom:16px;">
        ⚡ LordHost
      </h1>
      <p style="font-size:1.1rem;color:var(--muted-foreground);max-width:600px;margin:0 auto 24px;">
        Najtańszy i najszybszy hosting botów Discord w Polsce. Pakiety już od 3 PLN!
      </p>
      <a href="/#pakiety" class="neon-glow" style="display:inline-block;padding:12px 32px;background:var(--primary);color:var(--primary-foreground);font-family:'Orbitron',monospace;font-weight:700;border-radius:12px;text-decoration:none;">
        Zobacz pakiety
      </a>
    </div>
  </section>

  <!-- ============ PAKIETY ============ -->
  <section id="pakiety" style="max-width:1200px;margin:0 auto;padding:60px 20px;">
    <h2 class="neon-text" style="text-align:center;font-family:'Orbitron',monospace;font-size:1.8rem;color:var(--primary);margin-bottom:40px;">
      Nasze Pakiety
    </h2>
    <p style="text-align:center;color:var(--muted-foreground);margin-bottom:20px;">
      Pakiety ładowane dynamicznie z pliku packages.js / config
    </p>
  </section>

  <!-- ============ STOPKA ============ -->
  <footer class="glass-card" style="padding:24px 20px;text-align:center;border-top:1px solid hsl(55,100%,50%,0.15);margin-top:40px;">
    <p style="color:var(--muted-foreground);font-size:12px;">
      © 2025 LordHost. Wszelkie prawa zastrzeżone. |
      <a href="/rodo" style="color:var(--primary);text-decoration:none;">RODO</a> |
      <a href="/polityka-prywatnosci" style="color:var(--primary);text-decoration:none;">Polityka Prywatności</a>
    </p>
  </footer>

  <script src="links.js"></script>
</body>
</html>
